[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opennve"
version = "1.0.0"
description = "Open Neuromorphic Vision Engine: event cameras, .raw and HDF5 recordings, filters, time windows, frames and tiles, TensorFlow agents and multithreaded workflows"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Cameras: the SENSING SE1-S4 driver is in the fr3ak2402/neuromorphic-drivers wheel (0.19.2 or newer),
    # embedded in the openNVE wheels
    "neuromorphic_drivers>=0.19.2",
    # Events, filters, .raw decoding (EVT 2.0 / 2.1 / 3.0), time windows, frames and tiles
    "numpy>=1.26",
    # HDF5 event files (.h5 / .hdf5 with the columns x, y, p, t, l). h5py has no wheels for
    # Python 3.15 yet (building it needs the HDF5 library), so it is installed up to 3.14
    "h5py>=3.12; python_version < '3.15'",
    # Display (frame.to_image, examples), resizing of agent inputs
    "opencv-python>=4.10",
    # Agents: TensorFlow Lite models (.tflite) with LiteRT. LiteRT has wheels for Windows x64,
    # Linux x64 / ARM64 and macOS ARM64 (Python 3.14); elsewhere it is skipped and .tflite models
    # run with TensorFlow (extra "tensorflow")
    "ai-edge-litert>=2.3; python_version < '3.15' and (sys_platform != 'darwin' or platform_machine == 'arm64')",
]

[project.urls]
Homepage = "https://github.com/fr3ak2402/openNVE"
Documentation = "https://github.com/fr3ak2402/openNVE/wiki"
Changelog = "https://github.com/fr3ak2402/openNVE/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Events as pandas DataFrames (FrameEngine.generate_frame / build accept DataFrames with x, y, p, t),
# HDF5 files written by pandas in table format (PyTables)
pandas = ["pandas>=2.2", "tables>=3.10"]
# TensorFlow (about 600 MB): neural networks (building, training, TensorFlow Lite export) and agents
# with Keras / SavedModel models. Stable TensorFlow has no Python 3.14 wheels yet, so this installs
# the nightly build (tf-nightly, includes Keras 3); see docs/agents.md
tensorflow = ["tf-nightly"]
# LiteRT on its own (already a dependency where wheels exist)
tflite = ["ai-edge-litert>=2.3"]
test = ["pytest"]
all = ["pandas>=2.2", "tables>=3.10", "tf-nightly", "pytest"]

[project.scripts]
opennve = "opennve.cli:main"

[tool.setuptools.packages.find]
include = ["opennve*"]
