[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opennve"
version = "0.25.9"
description = "Open Neuromorphic Vision Engine: event cameras and .raw recordings, JSON configuration, filters, time windows, frames and tiles"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Cameras: the SENSING SE1-S4 driver is in the fr3ak2402/neuromorphic-drivers wheel (0.19.2 or newer),
    # embedded in the openNVE wheels
    "neuromorphic_drivers>=0.19.2",
    # Events, filters, .raw decoding (EVT 2.0 / 2.1 / 3.0), time windows, frames and tiles
    "numpy>=1.26",
    # Display (frame.to_image, examples)
    "opencv-python>=4.10",
]

[project.optional-dependencies]
# Events as pandas DataFrames (FrameEngine.generate_frame / build accept DataFrames with x, y, p, t)
pandas = ["pandas>=2.2"]
# Agents: TensorFlow Lite models (.tflite) with LiteRT. TensorFlow models (.keras, .h5, SavedModel)
# need TensorFlow, which is installed separately (Python 3.14: tf-nightly, see docs/agents.md)
tflite = ["ai-edge-litert>=2.3"]
test = ["pytest"]
all = ["pandas>=2.2", "ai-edge-litert>=2.3", "pytest"]

[project.scripts]
opennve = "opennve.__main__:main"

[tool.setuptools.packages.find]
include = ["opennve*"]
