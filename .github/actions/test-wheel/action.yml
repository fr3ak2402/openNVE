name: Test openNVE wheel
description: Installs the bundled openNVE wheel for one Python version and runs the tests against it
inputs:
  python-version:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true
    - shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/venv-${{ inputs.python-version }}"
        if [ -f "$RUNNER_TEMP/venv-${{ inputs.python-version }}/Scripts/python.exe" ]; then
          VENV_BIN="$RUNNER_TEMP/venv-${{ inputs.python-version }}/Scripts"
        else
          VENV_BIN="$RUNNER_TEMP/venv-${{ inputs.python-version }}/bin"
        fi
        "$VENV_BIN/python" -m pip install --upgrade pip
        "$VENV_BIN/python" -m pip install numpy pytest
        "$VENV_BIN/python" -m pip install --no-index --find-links dist opennve
        cd "$RUNNER_TEMP"
        "$VENV_BIN/python" -c "import sys, opennve, neuromorphic_drivers as nd; print(sys.version); print(opennve.__file__, opennve.NEUROMORPHIC_DRIVERS_VERSION); assert 'site-packages' in opennve.__file__; assert hasattr(nd, 'sensing_se1_s4')"
        "$VENV_BIN/opennve" models
        "$VENV_BIN/opennve" check "$GITHUB_WORKSPACE/examples/cameras.json"
        cd "$GITHUB_WORKSPACE"
        "$VENV_BIN/pytest" -q -p no:cacheprovider tests
