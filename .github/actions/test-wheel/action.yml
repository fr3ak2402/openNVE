name: Test openNVE wheel
description: Installs the bundled openNVE wheel for one Python version and runs the tests against it
inputs:
  python-version:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true
    - shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/venv-${{ inputs.python-version }}"
        if [ -f "$RUNNER_TEMP/venv-${{ inputs.python-version }}/Scripts/python.exe" ]; then
          VENV_BIN="$RUNNER_TEMP/venv-${{ inputs.python-version }}/Scripts"
        else
          VENV_BIN="$RUNNER_TEMP/venv-${{ inputs.python-version }}/bin"
        fi
        "$VENV_BIN/python" -m pip install --upgrade pip
        "$VENV_BIN/python" -m pip install numpy opencv-python pytest
        # optional extra: tests with pandas DataFrames run if a pandas wheel exists for this Python version
        "$VENV_BIN/python" -m pip install --only-binary :all: pandas || echo "no pandas wheel, DataFrame tests are skipped"
        "$VENV_BIN/python" -m pip install --only-binary :all: tables || echo "no PyTables wheel, pandas table HDF5 tests are skipped"
        # the openNVE wheel from dist, its dependencies (numpy, OpenCV, LiteRT) from PyPI
        "$VENV_BIN/python" -m pip install --no-index --find-links dist --no-deps opennve
        "$VENV_BIN/python" -m pip install --find-links dist opennve
        "$VENV_BIN/python" -m pip show ai-edge-litert >/dev/null 2>&1 && echo "LiteRT installed as a dependency" || echo "no LiteRT for this platform / Python version, TensorFlow Lite tests are skipped"
        cd "$RUNNER_TEMP"
        "$VENV_BIN/python" -c "import sys, opennve, neuromorphic_drivers as nd; print(sys.version); print(opennve.__file__, opennve.NEUROMORPHIC_DRIVERS_VERSION); assert 'site-packages' in opennve.__file__; assert hasattr(nd, 'sensing_se1_s4'); import cv2; print('opencv', cv2.__version__)"
        "$VENV_BIN/opennve" version
        "$VENV_BIN/python" -c "import opennve; info = opennve.version_info(); assert info['build_source'] == 'wheel', info; print(opennve.version_string())"
        "$VENV_BIN/opennve" models
        "$VENV_BIN/opennve" system
        "$VENV_BIN/python" -c "import opennve; info = opennve.system_info(); assert info['usable_cpus'] >= 1 and info['memory']['total'], info"
        "$VENV_BIN/python" -c "import os, opennve; ok = opennve.litert_accelerators()['compiled_model']; print(opennve.benchmark_report(opennve.benchmark_agent(opennve.AgentConfig(model=os.path.join(os.environ['GITHUB_WORKSPACE'], 'tests', 'data', 'agent_unet.tflite')), devices=('cpu', 'gpu', 'npu', 'auto'), count=32)) if ok else 'LiteRT 2.4 not installed: no GPU / NPU benchmark')"
        "$VENV_BIN/opennve" check "$GITHUB_WORKSPACE/examples/cameras.json" "$GITHUB_WORKSPACE/examples/frames.json" "$GITHUB_WORKSPACE/examples/agents.json" "$GITHUB_WORKSPACE/examples/workflows.json"
        cd "$GITHUB_WORKSPACE"
        "$VENV_BIN/pytest" -q -p no:cacheprovider tests
