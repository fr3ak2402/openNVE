# Publishes docs/ to the GitHub wiki of this repository (tools/docs_to_wiki.py).
# The wiki must exist: create the first page once in the Wiki tab of the repository.
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/docs_to_wiki.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::The wiki does not exist yet. Open the Wiki tab of the repository, create the first page (any content), then run this workflow again (Actions -> Wiki -> Run workflow)."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Convert docs/ to wiki pages
        run: python tools/docs_to_wiki.py wiki --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"

      - name: Publish
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date"
            exit 0
          fi
          git commit -m "Update wiki from docs/ (${GITHUB_SHA::7})"
          git push
