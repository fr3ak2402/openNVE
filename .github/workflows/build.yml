# Builds the opennve wheel and source distribution, runs the tests and attaches
# the files to the GitHub release for tags starting with "v" (for instance v0.1.0).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: neuromorphic-drivers -> target

      # neuromorphic_drivers with the SE1-S4 driver, built from the fork
      - name: Install neuromorphic_drivers (fr3ak2402 fork)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/fr3ak2402/neuromorphic-drivers.git
          python -m pip install --upgrade pip
          python -m pip install ./neuromorphic-drivers/python

      - name: Test
        shell: bash
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -v
          opennve models
          opennve check examples/cameras.json

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check wheel contents
        run: |
          python -m zipfile -l dist/*.whl
          python -m zipfile -l dist/*.whl | grep -q "opennve/__init__.py"

      - uses: actions/upload-artifact@v4
        with:
          name: opennve-dist
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
